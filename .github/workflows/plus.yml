name: plus

# Omalauncher+: builds the release APK on every push to main and keeps it as an artifact. It is signed with the
# debug key only; the release key never leaves the phone, where the APK is signed again before it's installed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch proot
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libarchive-tools
          ndk=$(sed -n 's/^NDK_VERSION=//p' scripts/fetch-proot.sh)
          [ -d "$ANDROID_HOME/ndk/$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" >/dev/null
          scripts/fetch-proot.sh

      - name: Build
        run: ./gradlew :app:assembleFossRelease

      - name: Name the APK
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/foss/release/app-foss-release.apk "omalauncher-plus-$name-unsigned.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: omalauncher-plus-apk
          path: omalauncher-plus-*-unsigned.apk
          retention-days: 30
